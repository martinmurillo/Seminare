  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --cream: #FAF6F0;
      --blush: #E8C9B5;
      --rose: #C97B63;
      --deep: #3D2B1F;
      --forest: #4A5C43;
      --sage: #8BA888;
      --gold: #B8A06A;
      --white: #FFFFFF;
      --text: #2C1F17;
      --text-light: #7A6358;

      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Jost', sans-serif;

      --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      background: var(--cream);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--cream); }
    ::-webkit-scrollbar-thumb { background: var(--blush); border-radius: 3px; }

    /* ===== NAV ===== */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 3rem;
      transition: var(--transition);
    }

    nav.scrolled {
      background: rgba(250,246,240,0.95);
      backdrop-filter: blur(12px);
      box-shadow: 0 1px 0 rgba(61,43,31,0.08);
    }

    .nav-logo {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--deep);
      text-decoration: none;
      font-style: italic;
    }

    .nav-logo span { color: var(--rose); }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-light);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--rose); }

    .nav-ig {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-light);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-ig:hover { color: var(--rose); }

    /* ===== HERO ===== */
    #hero {
      min-height: 100vh;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    .hero-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8rem 4rem 4rem 6rem;
      position: relative;
      z-index: 2;
    }

    .hero-eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--rose);
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(3.5rem, 6vw, 6rem);
      font-weight: 300;
      line-height: 1.05;
      color: var(--deep);
      margin-bottom: 1rem;
    }

    .hero-title em {
      font-style: italic;
      color: var(--rose);
    }

    .hero-subtitle {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 300;
      color: var(--text-light);
      line-height: 1.7;
      margin-bottom: 2.5rem;
      max-width: 380px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--rose);
      color: white;
      padding: 0.9rem 2rem;
      border-radius: 2px;
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 500;
      transition: var(--transition);
      border: none;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--deep);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(61,43,31,0.2);
    }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      border: 1px solid var(--blush);
      color: var(--text-light);
      padding: 0.9rem 2rem;
      border-radius: 2px;
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 400;
      transition: var(--transition);
    }
    .btn-outline:hover { border-color: var(--rose); color: var(--rose); }

    .hero-badge {
      position: absolute;
      bottom: 3rem;
      left: 6rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.75rem;
      color: var(--text-light);
      letter-spacing: 0.1em;
    }

    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--sage);
    }

    .hero-right {
      position: relative;
      overflow: hidden;
    }

    .hero-mosaic {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
    }

    .mosaic-cell {
      overflow: hidden;
      position: relative;
    }

    .mosaic-cell img,
    .mosaic-placeholder {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.8s ease;
    }

    .mosaic-cell:hover img { transform: scale(1.05); }

    .mosaic-placeholder {
      background: linear-gradient(135deg, var(--blush), var(--sage));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }

    /* gradient overlay from left side */
    .hero-right::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 80px;
      background: linear-gradient(to right, var(--cream), transparent);
      z-index: 1;
      pointer-events: none;
    }

    /* ===== DECORATIVE ELEMENTS ===== */
    .leaf-decor {
      position: absolute;
      opacity: 0.08;
      pointer-events: none;
    }

    /* ===== SECTION HEADER ===== */
    .section-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--rose);
      margin-bottom: 0.8rem;
      font-weight: 500;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 300;
      color: var(--deep);
      line-height: 1.2;
    }

    .section-title em { font-style: italic; color: var(--rose); }

    .section-line {
      width: 60px;
      height: 1px;
      background: var(--blush);
      margin: 1.2rem auto 0;
    }

    /* ===== ABOUT STRIP ===== */
    #about-strip {
      background: var(--deep);
      color: var(--cream);
      padding: 2rem 6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .strip-item {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .strip-icon {
      font-size: 1.4rem;
    }

    .strip-text strong {
      display: block;
      font-family: var(--font-serif);
      font-size: 1.2rem;
      font-weight: 300;
    }

    .strip-text span {
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--blush);
      opacity: 0.7;
    }

    .strip-divider {
      width: 1px;
      height: 40px;
      background: rgba(255,255,255,0.15);
    }

    /* ===== GALLERY ===== */
    #gallery {
      padding: 6rem 4rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .gallery-filters {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.5rem 1.4rem;
      border: 1px solid var(--blush);
      background: transparent;
      border-radius: 100px;
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-light);
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--rose);
      border-color: var(--rose);
      color: white;
    }

    /* ===== MOSAIC GALLERY GRID ===== */
    .gallery-mosaic-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 80px;
      gap: 8px;
    }

    /* Size patterns cycling: large, medium, small */
    .gallery-item { position: relative; overflow: hidden; border-radius: 6px; cursor: pointer; }
    .gallery-item.size-large  { grid-column: span 6; grid-row: span 4; }
    .gallery-item.size-medium { grid-column: span 4; grid-row: span 3; }
    .gallery-item.size-small  { grid-column: span 3; grid-row: span 2; }
    .gallery-item.size-wide   { grid-column: span 8; grid-row: span 3; }
    .gallery-item.size-tall   { grid-column: span 3; grid-row: span 4; }

    @media (max-width: 900px) {
      .gallery-mosaic-grid { grid-template-columns: repeat(6, 1fr); grid-auto-rows: 70px; }
      .gallery-item.size-large  { grid-column: span 4; grid-row: span 4; }
      .gallery-item.size-medium { grid-column: span 3; grid-row: span 3; }
      .gallery-item.size-small  { grid-column: span 2; grid-row: span 2; }
      .gallery-item.size-wide   { grid-column: span 5; grid-row: span 3; }
      .gallery-item.size-tall   { grid-column: span 2; grid-row: span 4; }
    }

    @media (max-width: 540px) {
      .gallery-mosaic-grid { grid-template-columns: repeat(4, 1fr); grid-auto-rows: 65px; }
      .gallery-item.size-large  { grid-column: span 3; grid-row: span 3; }
      .gallery-item.size-medium { grid-column: span 2; grid-row: span 3; }
      .gallery-item.size-small  { grid-column: span 2; grid-row: span 2; }
      .gallery-item.size-wide   { grid-column: span 4; grid-row: span 2; }
      .gallery-item.size-tall   { grid-column: span 2; grid-row: span 4; }
    }

    .gallery-item img,
    .gallery-item-placeholder {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .gallery-item-placeholder {
      background: linear-gradient(135deg, var(--blush) 0%, var(--sage) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
    }

    .gallery-item:hover img,
    .gallery-item:hover .gallery-item-placeholder { transform: scale(1.06); }

    .gallery-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(61,43,31,0.8) 0%, transparent 55%);
      opacity: 0; transition: opacity 0.35s;
      display: flex; align-items: flex-end; padding: 1rem;
    }
    .gallery-item:hover .gallery-overlay { opacity: 1; }

    .gallery-overlay-text { color: white; font-family: var(--font-serif); font-size: 0.95rem; font-weight: 300; }
    .gallery-overlay-tag { display: block; font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--blush); margin-top: 0.2rem; }

    /* Category divider */
    .gallery-category-divider {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.5rem 0;
      margin-top: 0.5rem;
    }

    .gallery-category-divider::before,
    .gallery-category-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--blush);
      opacity: 0.5;
    }

    .gallery-category-label {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--rose);
      white-space: nowrap;
      font-weight: 500;
    }

    /* ===== SERVICES ===== */
    #services {
      background: var(--deep);
      padding: 6rem 4rem;
      color: var(--cream);
      position: relative;
    }

    #services .section-title { color: var(--cream); }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Each card has its own background photo */
    .service-card {
      border-radius: 8px;
      padding: 0;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* Photo layer inside card */
    .service-card-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-color: var(--deep);
      transition: transform 0.6s ease;
      filter: saturate(0.85);
    }

    .service-card:hover .service-card-bg { transform: scale(1.05); }

    /* Gradient overlay so text is readable */
    .service-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(30,18,10,0.92) 0%,
        rgba(30,18,10,0.55) 50%,
        rgba(30,18,10,0.20) 100%
      );
      transition: background 0.4s;
    }

    .service-card:hover .service-card-overlay {
      background: linear-gradient(
        to top,
        rgba(201,123,99,0.88) 0%,
        rgba(61,43,31,0.65) 50%,
        rgba(30,18,10,0.25) 100%
      );
    }

    /* Top accent line on hover */
    .service-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(to right, var(--rose), var(--gold));
      transform: scaleX(0);
      transition: transform 0.4s;
      z-index: 3;
    }

    .service-card:hover::before { transform: scaleX(1); }

    /* Text content */
    .service-card-content {
      position: relative;
      z-index: 2;
      padding: 1.8rem;
    }

    .service-icon { font-size: 1.8rem; margin-bottom: 0.8rem; display: block; }
    .service-title { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 300; color: white; margin-bottom: 0.5rem; line-height: 1.2; }
    .service-desc { font-size: 0.82rem; color: rgba(255,255,255,0.7); line-height: 1.65; margin-bottom: 1rem; }
    .service-tag { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--blush); }
    .service-wa-hint { margin-top: 1rem; display: flex; align-items: center; gap: 0.4rem; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.45); transition: color 0.3s; }
    .service-card:hover .service-wa-hint { color: rgba(255,255,255,0.85); }
